# Red-team demo configuration. Copy this to redteam.ini and edit it before running any
# attack. The kit refuses to run against anything not listed here, and the listed ranges
# must be private. This keeps the demo pointed at YOUR OWN cluster.

[cluster]
# The only addresses the attack scripts may touch. Comma- or newline-separated; CIDR or
# single addresses; private ranges only (192.168.x, 10.x, 172.16-31.x).
allow = 192.168.1.0/24

# The hub's dashboard URL, for your reference only (verify.py reads the database directly,
# not this URL, because the dashboard is bound to localhost on the hub).
hub = http://127.0.0.1:8080

[web]
# The test web application to send SQLi/XSS probes at (DVWA, or your own test endpoint).
# Must resolve to an address inside [cluster] allow. Never a production site.
url = http://192.168.1.21/dvwa/vulnerabilities/sqli/
param = id

[demo]
# trigger-poll.py: lets the hub's /demo page queue an attack for this box to run, without
# the hub ever reaching out to Kali. Get api_key from the hub's /demo page (owner login
# required) and paste it here. Every target still has to pass [cluster] allow above, no
# matter what the hub sends, so this cannot be pointed outside your own cluster.
hub_url = https://sxmukelo.co.za
api_key = paste-the-key-from-the-hub-demo-page
poll_s = 4
default_user = pidemo
# PASSWORD=real-pw env var still required for a breakin scenario, same as running it by hand.
